<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/cliente.js" defer></script>
    <title>Oficina Mecânica - Clientes</title>
</head>

<body>
    <header>
        <h1>Oficina Mecânica</h1>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="cliente.html">Clientes</a></li>
            <li><a href="veiculo.html">Veículos</a></li>
            <li><a href="mecanico.html">Mecânicos</a></li>
            <li><a href="peca.html">Peças</a></li>
            <li><a href="os.html">Ordem de Serviço</a></li>
        </ul>
    </nav>
    <main>
        <h2>Cadastro de Cliente</h2>
        <form id="form-cliente">
            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome" minlength="3" placeholder="Digite o nome completo" required>
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" name="telefone" placeholder="(34) 99999-9999" maxlength="15" required>
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="exemplo@dominio.com" required>
            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco" name="endereco" required>
            <button>Cadastrar</button>
        </form>
        <div id="mensagem"></div>
        <a class="voltar" href="index.html">Voltar à página inicial</a>
    </main>
</body>

</html>
